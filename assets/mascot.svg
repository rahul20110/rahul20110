<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 300" role="img" aria-label="A friendly robot with a call-center headset, celebrating with confetti.">
  <style>
    .confetti { animation: fall 2.6s linear infinite; }
    .c2 { animation-delay: .5s; }
    .c3 { animation-delay: 1s; }
    .c4 { animation-delay: 1.5s; }
    .c5 { animation-delay: 2s; }
    .wave { transform-box: fill-box; transform-origin: 10% 90%; animation: wave 1.8s ease-in-out infinite; }
    .bob { transform-box: fill-box; transform-origin: 50% 100%; animation: bob 2.4s ease-in-out infinite; }
    @keyframes fall {
      0% { transform: translateY(-30px) rotate(0deg); opacity: 0; }
      15% { opacity: 1; }
      100% { transform: translateY(240px) rotate(220deg); opacity: 0; }
    }
    @keyframes wave {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-22deg); }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @media (prefers-reduced-motion: reduce) { .confetti, .c2, .c3, .c4, .c5, .wave, .bob { animation: none; } }
  </style>

  <!-- confetti -->
  <g>
    <rect class="confetti" x="30" y="20" width="8" height="12" rx="2" fill="#F472B6"/>
    <rect class="confetti c2" x="200" y="10" width="8" height="12" rx="2" fill="#FBBF24"/>
    <circle class="confetti c3" cx="70" cy="18" r="5" fill="#34D399"/>
    <rect class="confetti c4" x="150" y="14" width="8" height="12" rx="2" fill="#A78BFA"/>
    <circle class="confetti c5" cx="230" cy="22" r="5" fill="#60A5FA"/>
    <circle class="confetti c2" cx="110" cy="12" r="4" fill="#FB7185"/>
    <rect class="confetti c5" x="55" y="16" width="7" height="10" rx="2" fill="#FDE047"/>
  </g>

  <g class="bob">
    <!-- body -->
    <rect x="85" y="170" width="90" height="80" rx="22" fill="#C4B5FD"/>
    <rect x="103" y="190" width="54" height="36" rx="10" fill="#2A1B3D"/>
    <circle cx="118" cy="208" r="5" fill="#7DF9FF"/>
    <rect x="130" y="203" width="20" height="10" rx="3" fill="#A855F7"/>

    <!-- left arm waving -->
    <g class="wave">
      <path d="M 85 195 Q 50 180 42 148" stroke="#C4B5FD" stroke-width="16" fill="none" stroke-linecap="round"/>
      <circle cx="40" cy="142" r="12" fill="#E9D5FF"/>
    </g>
    <!-- right arm -->
    <path d="M 175 200 Q 205 215 212 240" stroke="#C4B5FD" stroke-width="16" fill="none" stroke-linecap="round"/>
    <circle cx="214" cy="246" r="12" fill="#E9D5FF"/>

    <!-- head -->
    <rect x="88" y="82" width="84" height="72" rx="20" fill="#E9D5FF"/>
    <rect x="100" y="100" width="60" height="30" rx="12" fill="#2A1B3D"/>
    <circle cx="118" cy="115" r="6" fill="#7DF9FF"/>
    <circle cx="142" cy="115" r="6" fill="#7DF9FF"/>
    <path d="M 116 138 q 14 10 28 0" stroke="#2A1B3D" stroke-width="3.5" fill="none" stroke-linecap="round"/>

    <!-- antenna -->
    <line x1="130" y1="82" x2="130" y2="66" stroke="#A855F7" stroke-width="4"/>
    <circle cx="130" cy="60" r="6" fill="#F472B6"/>

    <!-- headset -->
    <path d="M 92 108 a 40 34 0 0 1 76 0" stroke="#7C3AED" stroke-width="7" fill="none"/>
    <rect x="82" y="102" width="12" height="24" rx="6" fill="#7C3AED"/>
    <rect x="166" y="102" width="12" height="24" rx="6" fill="#7C3AED"/>
    <path d="M 172 126 q 6 20 -16 24" stroke="#7C3AED" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="152" cy="152" r="5" fill="#F472B6"/>

    <!-- legs -->
    <rect x="100" y="250" width="16" height="22" rx="8" fill="#A78BFA"/>
    <rect x="144" y="250" width="16" height="22" rx="8" fill="#A78BFA"/>
  </g>
</svg>
