<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" role="img" aria-label="Click2Call: the agent calls from the browser over WebRTC, through self-hosted LiveKit plus SIP, out to the customer's phone. You hear busy and switched-off announcements via 183 early media. Supervisors can listen, whisper, or barge.">
  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, Menlo, monospace; }
    .flow { stroke-dasharray: 7 7; animation: flow 1.1s linear infinite; }
    .drip { stroke-dasharray: 4 6; animation: flow 1.4s linear infinite; }
    .ring { transform-box: fill-box; transform-origin: 50% 85%; animation: ring 2.6s ease-in-out infinite; }
    .talk { transform-box: fill-box; transform-origin: 50% 100%; animation: talk 1s ease-in-out infinite; }
    .t2 { animation-delay: .2s; }
    .t3 { animation-delay: .4s; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @keyframes ring {
      0%, 68%, 100% { transform: rotate(0deg); }
      72% { transform: rotate(3deg); }
      76% { transform: rotate(-3deg); }
      80% { transform: rotate(3deg); }
      84% { transform: rotate(-2deg); }
      88% { transform: rotate(0deg); }
    }
    @keyframes talk {
      0%, 100% { transform: scaleY(0.35); }
      50% { transform: scaleY(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .flow, .drip, .ring, .talk, .t2, .t3 { animation: none; }
    }
  </style>

  <!-- ===== early-media callout bubble ===== -->
  <rect x="565" y="14" width="300" height="36" rx="9" fill="#F3E8FF" stroke="#A855F7" stroke-width="1.5"/>
  <text x="715" y="37" text-anchor="middle" class="mono" font-size="10.5" fill="#6B21A8">busy? switched off? you HEAR it &#8212; 183 early media</text>
  <path d="M 700 50 l -6 12 l 14 -12 z" fill="#F3E8FF" stroke="#A855F7" stroke-width="1.5"/>

  <!-- ===== supervisor ===== -->
  <circle cx="382" cy="38" r="13" fill="#1B1524" stroke="#DB2777" stroke-width="2"/>
  <circle cx="382" cy="34" r="4.5" fill="#F0ABFC"/>
  <path d="M 374 46 a 9 7 0 0 1 16 0" fill="#F0ABFC"/>
  <path d="M 370 34 a 12 11 0 0 1 24 0" stroke="#DB2777" stroke-width="2.5" fill="none"/>
  <text x="404" y="34" class="mono" font-size="11" font-weight="bold" fill="#9333EA">SUPERVISOR</text>
  <text x="404" y="50" class="mono" font-size="10" fill="#DB2777">listen &#183; whisper &#183; barge</text>
  <line class="drip" x1="382" y1="56" x2="418" y2="108" stroke="#DB2777" stroke-width="1.75"/>

  <!-- ===== agent browser ===== -->
  <rect x="60" y="88" width="200" height="104" rx="10" fill="#1B1524" stroke="#A855F7" stroke-width="2"/>
  <line x1="60" y1="108" x2="260" y2="108" stroke="#A855F7" stroke-width="1"/>
  <circle cx="78" cy="98" r="4" fill="#F472B6"/>
  <circle cx="92" cy="98" r="4" fill="#FBBF24"/>
  <circle cx="106" cy="98" r="4" fill="#34D399"/>
  <!-- mic + talking bars -->
  <rect x="112" y="126" width="16" height="26" rx="8" fill="#E9D5FF"/>
  <path d="M 106 144 a 14 14 0 0 0 28 0" stroke="#E9D5FF" stroke-width="2.5" fill="none"/>
  <line x1="120" y1="158" x2="120" y2="166" stroke="#E9D5FF" stroke-width="2.5"/>
  <rect class="talk"    x="150" y="128" width="6" height="34" rx="3" fill="#A855F7"/>
  <rect class="talk t2" x="162" y="128" width="6" height="34" rx="3" fill="#F472B6"/>
  <rect class="talk t3" x="174" y="128" width="6" height="34" rx="3" fill="#7DF9FF"/>
  <rect class="talk t2" x="186" y="128" width="6" height="34" rx="3" fill="#A855F7"/>
  <rect class="talk"    x="198" y="128" width="6" height="34" rx="3" fill="#F472B6"/>
  <text x="160" y="216" text-anchor="middle" class="mono" font-size="10.5" fill="#9333EA">AGENT &#8212; CALLS FROM THE BROWSER</text>

  <!-- ===== livekit node ===== -->
  <rect x="356" y="112" width="168" height="52" rx="12" fill="#1B1524" stroke="#A855F7" stroke-width="2"/>
  <text x="440" y="134" text-anchor="middle" class="mono" font-size="12" font-weight="bold" fill="#E9D5FF">LIVEKIT + SIP</text>
  <text x="440" y="152" text-anchor="middle" class="mono" font-size="9.5" fill="#A78BFA">self-hosted &#183; fork: rahul20110/sip</text>

  <!-- ===== customer phone ===== -->
  <g class="ring">
    <rect x="655" y="78" width="70" height="120" rx="14" fill="#1B1524" stroke="#A855F7" stroke-width="2"/>
    <rect x="664" y="92" width="52" height="86" rx="6" fill="#2A1B3D"/>
    <line x1="680" y1="85" x2="700" y2="85" stroke="#A78BFA" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="690" cy="188" r="4" fill="#A78BFA"/>
    <path d="M 683 128 a 10 10 0 0 1 14 0 M 687 135 a 5 5 0 0 1 6 0" stroke="#7DF9FF" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="690" cy="142" r="2" fill="#7DF9FF"/>
  </g>
  <text x="690" y="216" text-anchor="middle" class="mono" font-size="10.5" fill="#9333EA">CUSTOMER &#8212; ANY PHONE</text>

  <!-- ===== trunks ===== -->
  <text x="308" y="130" text-anchor="middle" class="mono" font-size="9" fill="#A78BFA">WEBRTC</text>
  <line class="flow" x1="260" y1="140" x2="356" y2="140" stroke="#DB2777" stroke-width="2"/>
  <text x="590" y="130" text-anchor="middle" class="mono" font-size="9" fill="#A78BFA">SIP TRUNK</text>
  <line class="flow" x1="524" y1="140" x2="655" y2="140" stroke="#DB2777" stroke-width="2"/>

  <!-- footer note -->
  <text x="440" y="252" text-anchor="middle" class="mono" font-size="10" fill="#9333EA">outbound dial &#8594; agent mic live before ring &#8594; no dead air &#183; answer detection &#183; CRM webhooks</text>
</svg>
